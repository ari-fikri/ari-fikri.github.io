[build]
  command = "git submodule update --init --recursive && npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--max-old-space-size=4096"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next"
  SECRETS_SCAN_ENABLED = "false"

# Ensure TinaCMS admin SPA routes work when refreshed
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
